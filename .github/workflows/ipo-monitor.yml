name: HK IPO Monitor

on:
  schedule:
    # 早盘 (北京 09:00 = UTC 01:00)
    - cron: '0 1 * * 1-5'
    # 午后 (北京 14:00 = UTC 06:00)
    - cron: '0 6 * * 1-5'
    # 收盘后 (北京 17:00 = UTC 09:00)
    - cron: '0 9 * * 1-5'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run IPO Monitor
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python src/main.py

      - name: Upload state artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipo-state
          path: src/data/
          retention-days: 30
